aid: flowgpt
name: FlowGPT
description: >-
  FlowGPT is a community platform for discovering, sharing, and chatting with AI
  prompts, characters, and chatbots. Backed by DCM Ventures, it operates as a
  ChatGPT prompt and AI-character marketplace where creators publish prompts,
  roleplay characters, and AI apps across categories such as programming,
  marketing, business, and entertainment, and users engage them through free
  chat, leaderboards, bounties, and paid membership tiers. FlowGPT publishes
  user- and creator-facing product documentation (guide.flowgpt.com) but does
  not currently expose a public developer REST API, OpenAPI definition, or
  first-party SDK; programmatic access today is limited to unofficial community
  wrappers over its internal endpoints.
